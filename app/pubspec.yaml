name: visionmate
description: Offline-first voice-guided assistive platform for visually impaired users.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.0+2
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  tflite_flutter: ^0.12.1
  google_mlkit_text_recognition: ^0.17.1
  geolocator: ^14.0.3
  sensors_plus: ^7.1.0
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^7.3.1
  http: ^1.2.0
  provider: ^6.1.1
  json_annotation: ^4.8.1
  image: ^4.1.7
  file_picker: ^12.1.0
  pdf: ^3.10.8
  syncfusion_flutter_pdf: ^34.2.5
  google_mlkit_document_scanner: ^0.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.3
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    # - assets/models/braille_cnn.tflite
    - assets/models/yolov8_braille.tflite
    - assets/models/yolov8n.tflite
    - assets/models/detect.tflite
    # - assets/models/minilm.tflite
    - assets/labels/braille_labels.txt
    - assets/labels/yolo_labels.txt
