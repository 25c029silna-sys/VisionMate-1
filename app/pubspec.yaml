name: visionmate
description: Offline-first voice-guided assistive platform for visually impaired users.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.10.5
  speech_to_text: ^7.4.0
  flutter_tts: ^3.8.5
  tflite_flutter: ^0.11.0
  google_mlkit_text_recognition: ^0.11.0
  geolocator: ^10.1.0
  sensors_plus: ^5.0.1
  sqflite: ^2.3.0
  path: ^1.9.0
  path_provider: ^2.1.2
  permission_handler: ^11.3.1
  connectivity_plus: ^5.0.2
  http: ^1.2.0
  provider: ^6.1.1
  json_annotation: ^4.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  mocktail: ^1.0.3
  build_runner: ^2.4.8
  json_serializable: ^6.7.1

flutter:
  uses-material-design: true
  assets:
    - assets/models/braille_cnn.tflite
    - assets/models/yolov8n.tflite
    - assets/models/minilm.tflite
    - assets/labels/braille_labels.txt
    - assets/labels/yolo_labels.txt
